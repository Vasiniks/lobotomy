<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lobotomy</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">

<script type="importmap">{ "imports": { "three": "/assets/vendor/three/three.module.js" } }</script>
<script>
  // Theme before first paint: saved choice, else the system setting, else dark.
  (function () {
    var t = null;
    try { t = localStorage.getItem("lobotomy-theme"); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="lobotomy">
      <img class="on-dark" src="/assets/img/lockup-on-dark.svg" alt="lobotomy">
      <img class="on-light" src="/assets/img/lockup-on-light.svg" alt="lobotomy">
    </a>
  </header>
  <main class="body" id="body">
    <div class="loading"><p>Loading the model…</p></div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
