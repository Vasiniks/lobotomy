[project]
name = "lobotomy"
version = "0.1.0"
description = "Break a small LLM live while chatting with it, and see inside it to choose what to break."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0",
    "gguf>=0.19.0",
    "tokenizers>=0.22",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.32,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# NVIDIA GPUs (CUDA) or the CPU. Install the CUDA build of torch with
# `uv pip install -e ".[torch]" --torch-backend=auto` (picks the build for your driver).
torch = ["torch>=2.5", "safetensors>=0.4"]
cuda = ["torch>=2.5", "safetensors>=0.4"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
lobotomy = "lobotomy.cli:main"
lobe = "lobotomy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lobotomy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
