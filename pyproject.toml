[project]
name = "lobotomy"
version = "0.1.0"
description = "Break a small LLM live while chatting with it, and see inside it to choose what to break."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0",
    "gguf>=0.19.0",
    "tokenizers>=0.22",
    "jinja2>=3.1",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.32,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
cuda = ["torch>=2.5"]
dev = ["pytest>=8"]

[project.scripts]
lobotomy = "lobotomy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lobotomy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
